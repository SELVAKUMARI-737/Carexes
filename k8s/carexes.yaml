apiVersion: v1
kind: Namespace
metadata:
  name: carexes
  labels:
    istio-injection: enabled

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: carexes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: carexes
spec:
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: carexes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: auth-service

      containers:
        - name: auth-service
          image: localhost:5000/carexes-auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50051

          env:
            - name: AUTH_SERVICE_URL
              value: "0.0.0.0:50051"
            - name: MONGODB_URI
              value: "mongodb://mongodb:27017/carexes-auth-db"

          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets

      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: carexes
spec:
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: carexes
  annotations:
    gitops.fluxcd.io/test: "reconciliation-test"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: localhost:5000/carexes-api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: AUTH_SERVICE_URL
              value: "auth-service:50051"

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: carexes
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: NodePort